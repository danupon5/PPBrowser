name: Signed PPBrowser AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PPBROWSER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PPBROWSER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PPBROWSER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PPBROWSER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing PPBrowser signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ppbrowser-upload.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/ppbrowser-upload.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PPBrowser-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
